[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seismic-horizon-ai"
version = "0.1.0"
description = "Physics-first, AI-assisted 3D seismic horizon and fault interpretation (Wu-Fomel least-squares horizon engine)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - all rights reserved (owner to decide)" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "segyio>=1.9",
    "h5py>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=7"]
zarr = ["zarr>=2.16"]
accel = ["numba>=0.58"]
ml = ["torch>=2.1", "scikit-learn>=1.3"]
api = ["fastapi>=0.110", "pydantic>=2"]
gui = ["PySide6>=6.6", "pyvista>=0.43"]

[project.scripts]
shai = "seismic_horizon_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
